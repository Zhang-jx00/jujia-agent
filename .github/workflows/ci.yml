name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # 全量历史 + 标签：check:docs 有一条要核对「CHANGELOG 回退点标签真实存在」，
      # 默认 depth=1 的浅克隆**不带标签** → CI 上这条检查必然假红（CI 首跑回填抓到；
      # 本地全量克隆永远绿）。取全量是刻意的：宁多拉几百 KB，不关掉一条真检查。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm run test

      # 文档一致性（轨道回归计划 2 · R-06 补上）
      # 它便宜且确定：只读文件做结构比对，不需要构建 —— 正好适合 CI。
      # **CI 不跑什么，也如实写在这里**：smoke / perf / e2e 需要真实 Electron 与图形环境，
      # 在 GitHub 托管的无头环境里不稳定，因此**只在本地门禁跑**（见 docs/PROGRESS.md 的门禁清单）。
      - name: 文档一致性
        run: npm run check:docs

      # 锁可信度门禁（R82–R84 新增）。
      # 它问的是「**判据宣称的覆盖面 = 它实际测到的覆盖面吗**」——
      # R70 逮到的那条真缺陷（标题写着「ISC 要求随副本保留」，断言只查「模块里有这个字符串」）
      # 属于这一类，而这类坏法**不红**，只能靠机械比对当场逮住。
      # 两条都便宜且确定：只读源码做文本比对，不需要构建，适合 CI。
      # 顺序：先跑判据自己（确认判据没腐），再跑判据（确认仓里的锁没腐）。
      - name: 锁可信度判据自检
        run: npm run check:locks:selftest

      - name: 锁可信度
        run: npm run check:locks

      # 依赖许可证门禁（T14 补上）。它此前只在本地门禁跑：
      # 新增一个 copyleft 依赖要到发版前才被发现，比在 PR 里被拦住贵得多。
      # 它只读 package.json / lock 文件，不需要构建，适合 CI。
      - name: 依赖许可证
        run: npm run license:check

      - name: 构建（main / preload / renderer）
        run: npm run build

      # 第三方素材与依赖许可声明门禁（R70 新增）。
      # **它排在构建之后**：其中一条要查「声明在不在**构建产物**里」——
      # 查不到就是没保留（ISC 的「随副本保留」只对**分发副本**成立）。
      # 放在构建之前 ⇒ 量的是上一轮的 bundle ⇒ 假绿。
      - name: 第三方素材与许可声明
        run: npm run check:notices
