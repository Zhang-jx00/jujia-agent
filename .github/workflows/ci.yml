name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm run test

      # 文档一致性（轨道回归计划 2 · R-06 补上）
      # 它便宜且确定：只读文件做结构比对，不需要构建 —— 正好适合 CI。
      # **CI 不跑什么，也如实写在这里**：smoke / perf / e2e 需要真实 Electron 与图形环境，
      # 在 GitHub 托管的无头环境里不稳定，因此**只在本地门禁跑**（见 docs/PROGRESS.md 的门禁清单）。
      - name: 文档一致性
        run: npm run check:docs

      # 依赖许可证门禁（T14 补上）。它此前只在本地门禁跑：
      # 新增一个 copyleft 依赖要到发版前才被发现，比在 PR 里被拦住贵得多。
      # 它只读 package.json / lock 文件，不需要构建，适合 CI。
      - name: 依赖许可证
        run: npm run license:check

      - name: 构建（main / preload / renderer）
        run: npm run build
